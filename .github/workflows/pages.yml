name: Publish schedule to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check schedule calculations and application syntax
        run: |
          npm run check
          npm test
      - uses: actions/configure-pages@v5
      - name: Prepare website files
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css config.js manifest.webmanifest sw.js _site/
          cp -r src _site/src
          if [ -d assets ]; then cp -r assets _site/assets; fi
          node scripts/version-assets.mjs _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
